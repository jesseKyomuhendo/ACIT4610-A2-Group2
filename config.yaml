# ACIT4610 Assignment 2 settings for NSGA-II and SPEA2 on the CFLP
# Code reads these through src/util/fetch_config.py and paths are relative to the project root

# Paths
paths:
  data_dir: data/orlib          # folder with the OR-Library cap files
  checksum_file: SHA256SUMS     # hash file in data_dir that proves the data is unmodified
  results_dir: results          # folder for everything the scripts produce
  raw_dir: results/raw          # final fronts and runtimes of every run
  tables_dir: results/tables    # results tables as CSV and PNG
  figures_dir: results/figures  # Pareto-front plots

# Benchmark instances, one per size category
instances:
  small: cap41      # 16 facilities and 50 customers
  medium: cap101    # 25 facilities and 50 customers
  large: cap121     # 50 facilities and 50 customers

oversized_demand: report_infeasible   # report_infeasible stops with a message, split divides oversized customers (only if the lecturer allows it)

# Experiment setup
experiment:
  n_runs: 10        # independent runs per algorithm, instance and configuration
  base_seed: 42     # run k uses seed base_seed + k for both algorithms

# Parameter configurations, identical for both algorithms
configurations:
  C1:                         # baseline
    pop_size: 100             # individuals in the population
    archive_size: 100         # SPEA2 archive size, equal to pop_size for fairness
    initialization: random    # how the first population is created
    crossover_prob: 0.9       # probability that two parents are recombined
    mutation_prob: 0.02       # probability that each customer assignment is changed
    max_evaluations: 20000    # stop after this many objective evaluations

  C2:                         # larger population with the same budget, so fewer generations
    pop_size: 200             # individuals in the population
    archive_size: 200         # SPEA2 archive size, equal to pop_size for fairness
    initialization: random    # how the first population is created
    crossover_prob: 0.9       # probability that two parents are recombined
    mutation_prob: 0.02       # probability that each customer assignment is changed
    max_evaluations: 20000    # stop after this many objective evaluations

  C3:                         # more mutation and less crossover for more exploration
    pop_size: 100             # individuals in the population
    archive_size: 100         # SPEA2 archive size, equal to pop_size for fairness
    initialization: random    # how the first population is created
    crossover_prob: 0.7       # probability that two parents are recombined
    mutation_prob: 0.10       # probability that each customer assignment is changed
    max_evaluations: 20000    # stop after this many objective evaluations

# Algorithm details shared by both MOEAs
algorithms:
  tournament_size: 2    # binary tournament selection in both algorithms
  spea2_k: null         # k-th nearest neighbour for SPEA2 density, null means sqrt(pop_size + archive_size)

# Hypervolume on objectives normalised with the same ideal and nadir points for both algorithms
hypervolume:
  reference_point: [1.1, 1.1]   # in normalised space and worse than every solution

# Statistical test written by hand in src/stats_tests.py
statistics:
  test: wilcoxon_signed_rank    # paired test of run k of NSGA-II against run k of SPEA2
  alpha: 0.05                   # significance level

# Plotting
plotting:
  dpi: 300                      # image resolution of saved plots and tables
  front_to_plot: combined       # combined shows the non-dominated set of all runs, best_run the run with highest hypervolume
  config_to_plot: C1            # configuration shown in the Pareto plots