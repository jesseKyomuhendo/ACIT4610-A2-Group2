# Common experimental settings. Within a configuration BOTH MOEAs use identical values.
algorithms: [nsga2, spea2]
n_runs: 10                 # >= 10 independent runs required
base_seed: 4610            # run r uses seed base_seed + r (same seeds for both MOEAs)

# mutation_prob is per gene (chance to open/close each facility)
configurations:
  A:                       # small and fast: tests convergence under a tight budget
    pop_size: 20
    max_evaluations: 2000
    crossover_prob: 0.9
    mutation_prob: 0.05
    init: random_repair
  B:                       # medium, balanced
    pop_size: 50
    max_evaluations: 10000
    crossover_prob: 0.9
    mutation_prob: 0.05
    init: random_repair
  C:                       # large and explorative: bigger population, more mutation, less crossover
    pop_size: 100
    max_evaluations: 20000
    crossover_prob: 0.7
    mutation_prob: 0.1
    init: random_repair
