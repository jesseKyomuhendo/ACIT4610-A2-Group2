# Common experimental settings. Within a configuration BOTH MOEAs use identical values.
# Values below are placeholders - tune before running final experiments.
algorithms: [nsga2, spea2]
n_runs: 10                 # >= 10 independent runs required
base_seed: 4610            # run r uses seed base_seed + r (same seeds for both MOEAs)

configurations:
  A:
    pop_size: 50
    max_evaluations: 10000   # termination criterion (objective evaluations)
    crossover_prob: 0.9
    mutation_prob: 0.05
    init: random_repair
  B:
    pop_size: 100
    max_evaluations: 20000
    crossover_prob: 0.9
    mutation_prob: 0.02
    init: random_repair
  C:
    pop_size: 200
    max_evaluations: 40000
    crossover_prob: 0.8
    mutation_prob: 0.1
    init: random_repair
